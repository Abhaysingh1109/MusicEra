services:
  - type: web
    name: musicera
    env: node
    plan: free
    autoDeploy: true
    buildCommand: npm install && python3 -m pip install --upgrade pip && if [ "$ML_FEATURES_ENABLED" = "true" ]; then python3 -m pip install -r requirements-ml.txt; else echo "Skipping optional ML Python dependencies"; fi
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_BIN
        value: python3
      - key: ML_FEATURES_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGSSL
        value: "false"
      - key: PGSSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OTP_EXPIRY_MINUTES
        value: "10"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: OTP_ALLOW_PRODUCTION_DEV_FALLBACK
        value: "true"
      - key: SMTP_CONNECT_TIMEOUT_MS
        value: "10000"
      - key: SMTP_GREETING_TIMEOUT_MS
        value: "10000"
      - key: SMTP_SOCKET_TIMEOUT_MS
        value: "15000"
      - key: SMTP_VERIFY_TIMEOUT_MS
        value: "8000"
      - key: OTP_MAIL_TIMEOUT_MS
        value: "12000"
      - key: FACE_AUTH_REQUEST_TIMEOUT_MS
        value: "45000"
      - key: FACE_AUTH_WORKER_STARTUP_TIMEOUT_MS
        value: "90000"
