<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="logo.png" type="image/png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicEra - Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="navbar-styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"
    ></script>
    <style>
      .dashboard-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px 40px 20px;
        text-align: center;
      }

      body.has-navbar .dashboard-container {
        padding-top: 100px;
      }

      .welcome-card {
        background: var(--glass-bg, rgba(255, 255, 255, 0.05));
        border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
        border-radius: 24px;
        padding: 60px 80px;
        max-width: 600px;
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .welcome-icon {
        width: 100px;
        height: 100px;
        background: linear-gradient(
          135deg,
          var(--primary, #6366f1),
          var(--secondary, #ec4899)
        );
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 30px;
        font-size: 2.5rem;
        color: white;
      }

      .welcome-title {
        font-family: "Playfair Display", serif;
        font-size: 2.5rem;
        margin-bottom: 15px;
        background: linear-gradient(
          135deg,
          var(--primary, #6366f1),
          var(--secondary, #ec4899)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .welcome-subtitle {
        font-size: 1.2rem;
        color: var(--muted, #94a3b8);
        margin-bottom: 40px;
      }

      .user-info {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        margin-bottom: 40px;
        padding: 20px;
        background: rgba(99, 102, 241, 0.1);
        border-radius: 14px;
      }

      .user-avatar {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          var(--primary, #6366f1),
          var(--secondary, #ec4899)
        );
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        color: white;
      }

      .user-details {
        text-align: left;
      }

      .user-name {
        font-size: 1.3rem;
        font-weight: 600;
        color: var(--light, #f8fafc);
      }

      .user-email {
        font-size: 0.9rem;
        color: var(--muted, #94a3b8);
      }

      .dashboard-actions {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .btn-dashboard {
        padding: 16px 32px;
        border: none;
        border-radius: 14px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: "Poppins", sans-serif;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--primary, #6366f1),
          var(--secondary, #ec4899)
        );
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 40px rgba(99, 102, 241, 0.35);
      }

      .btn-secondary {
        background: var(--glass-bg, rgba(255, 255, 255, 0.05));
        border: 2px solid var(--glass-border, rgba(255, 255, 255, 0.1));
        color: var(--light, #f8fafc);
      }

      .btn-secondary:hover {
        border-color: var(--primary, #6366f1);
      }

      .face-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: rgba(16, 185, 129, 0.2);
        border-radius: 50px;
        color: #34d399;
        font-size: 0.85rem;
        margin-top: 10px;
      }
    </style>
  </head>
  <body class="has-navbar">
    <!-- Navbar - Embedded for static compatibility -->
    <nav id="musicera-navbar" class="navbar">
      <div class="navbar-container">
        <!-- Logo / Brand -->
        <div class="navbar-brand" id="navbarLogo" onclick="handleLogoClick()">
          <i class="brand-logo-image" id="logoIcon" aria-hidden="true"></i>
          <span id="logoText">MusicEra</span>
        </div>

        <!-- Hamburger Button -->
        <button class="navbar-hamburger" id="navbarToggle">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <!-- User Dropdown Menu -->
      <div class="navbar-dropdown" id="navbarDropdown">
        <div class="user-profile">
          <div class="user-avatar">
            <i class="fas fa-user"></i>
          </div>
          <div class="user-details">
            <div class="user-name" id="navbarUserName">User</div>
            <div class="user-email" id="navbarUserEmail">user@example.com</div>
            <div class="face-badge" id="navbarFaceBadge" style="display: none">
              <i class="fas fa-face-smile"></i> Face ID Enabled
            </div>
          </div>
        </div>
        <button class="navbar-menu-action" onclick="openMyPlaylist()">
          <i class="fas fa-heart"></i>
          My Playlist
        </button>
        <button class="navbar-logout" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i>
          Logout
        </button>
      </div>
    </nav>

    <div class="dashboard-container">
      <!-- Welcome Header -->
      <!-- <header class="dashboard-header">
            <div class="welcome-card">
                <div class="welcome-icon">
                    <i class="fas fa-music"></i>
                </div>
                <h1 class="welcome-title">Welcome, <span id="userName">User</span>!</h1>
                <p class="welcome-subtitle">Discover your favorite music with MusicEra</p>
                
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <div class="user-name" id="displayName">User Name</div>
                        <div class="user-email" id="userEmail">user@email.com</div>
                        <div class="face-badge" id="faceBadge" style="display: none;">
                            <i class="fas fa-face-smile"></i> Face ID Enabled
                        </div>
                    </div>
                </div>
            </div>
        </header> -->

      <!-- Music Search Section -->
      <main class="music-search-section">
        <div class="search-hero">
          <h2 class="search-title">Search Any Song</h2>
          <!-- Search Container -->
          <div class="search-container">
            <div class="search-box">
              <i class="fas fa-search search-icon"></i>
              <input
                type="text"
                id="musicSearchInput"
                placeholder="Search for songs, artists, albums... (e.g. 'Shape of You')"
                autocomplete="off"
                aria-label="Search songs"
                aria-haspopup="listbox"
                aria-expanded="false"
              />
              <button id="searchBtn" class="search-btn">
                <i class="fas fa-play"></i>
              </button>
              <button id="clearSearch" class="clear-btn">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div
              id="searchSuggestions"
              class="search-suggestions"
              role="listbox"
              aria-label="Search suggestions"
            ></div>
            <div
              id="loadingSpinner"
              class="loading-spinner"
              style="display: none"
            >
              <i class="fas fa-spinner fa-spin"></i>
            </div>
          </div>
        </div>

        <!-- Results Header -->
        <div class="results-header">
          <div class="results-header-top">
            <h3 id="recommendationTitle" class="recommendation-title">
              Recommended for you
            </h3>
            <button id="shuffleFeedBtn" class="shuffle-feed-btn" type="button">
              <i class="fas fa-shuffle"></i>
              Shuffle
            </button>
          </div>
          <div
            id="genreChips"
            class="genre-chips"
            aria-label="Music categories"
          >
            <button
              class="genre-chip active"
              type="button"
              data-label="For You"
              data-query=""
            >
              For You
            </button>
            <button
              class="genre-chip"
              type="button"
              data-label="Pop"
              data-query="top pop songs"
            >
              Pop
            </button>
            <button
              class="genre-chip"
              type="button"
              data-label="Lo-fi"
              data-query="lofi chill beats"
            >
              Lo-fi
            </button>
            <button
              class="genre-chip"
              type="button"
              data-label="Bollywood"
              data-query="latest bollywood songs"
            >
              Bollywood
            </button>
            <button
              class="genre-chip"
              type="button"
              data-label="Punjabi"
              data-query="trending punjabi songs"
            >
              Punjabi
            </button>
          </div>
          <span id="resultsCount">0 results</span>
        </div>

        <div class="playlist-modal" id="playlistModal" aria-hidden="true">
          <div
            class="playlist-modal-content"
            role="dialog"
            aria-modal="true"
            aria-label="Your playlists"
          >
            <button
              class="playlist-modal-close"
              type="button"
              onclick="closeMyPlaylist()"
              aria-label="Close playlist"
            >
              <i class="fas fa-times"></i>
            </button>

            <section
              class="playlist-panel"
              id="playlistPanel"
              aria-label="User playlist"
            >
              <div class="playlist-panel-header">
                <h3><i class="fas fa-heart"></i> Your Playlists</h3>
                <div class="playlist-panel-actions">
                  <span id="playlistCount">0 songs</span>
                  <button
                    id="clearPlaylistBtn"
                    class="playlist-clear-btn"
                    type="button"
                  >
                    Clear
                  </button>
                </div>
              </div>

              <div class="playlist-toolbar">
                <select
                  id="playlistSelect"
                  class="playlist-select"
                  aria-label="Choose playlist"
                ></select>
                <button
                  id="createPlaylistBtn"
                  class="playlist-control-btn"
                  type="button"
                >
                  <i class="fas fa-plus"></i> New
                </button>
                <button
                  id="deletePlaylistBtn"
                  class="playlist-control-btn danger"
                  type="button"
                >
                  <i class="fas fa-trash"></i> Delete
                </button>
              </div>

              <div class="playlist-io-row">
                <button
                  id="exportPlaylistBtn"
                  class="playlist-io-btn"
                  type="button"
                >
                  <i class="fas fa-file-export"></i> Export JSON
                </button>
                <button
                  id="importPlaylistBtn"
                  class="playlist-io-btn"
                  type="button"
                >
                  <i class="fas fa-file-import"></i> Import JSON
                </button>
                <input
                  id="importPlaylistInput"
                  type="file"
                  accept="application/json"
                  hidden
                />
              </div>

              <div id="playlistItems" class="playlist-items"></div>
            </section>

            <div
              class="create-playlist-modal"
              id="createPlaylistModal"
              aria-hidden="true"
            >
              <form
                class="create-playlist-dialog"
                id="createPlaylistForm"
                autocomplete="off"
              >
                <h4>Create New Playlist</h4>
                <input
                  id="createPlaylistNameInput"
                  type="text"
                  maxlength="40"
                  placeholder="Enter playlist name"
                  aria-label="Playlist name"
                />
                <div class="create-playlist-actions">
                  <button
                    type="button"
                    class="playlist-control-btn"
                    id="cancelCreatePlaylistBtn"
                  >
                    Cancel
                  </button>
                  <button type="submit" class="playlist-control-btn">
                    Create
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Search Results -->
        <div id="searchResults" class="search-results"></div>
        <div id="noResultsMsg" class="no-results" style="display: none">
          <i class="fas fa-search"></i>
          <h3>No songs found</h3>
          <p>Try searching for a different song or artist</p>
        </div>

        <!-- YouTube Player -->
        <div id="youtubePlayer" class="player-container">
          <button class="player-overlay-close" onclick="closeOverlay()">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </main>
    </div>

    <script>
      // Navbar functionality
      document.addEventListener("DOMContentLoaded", function () {
        const hamburger = document.getElementById("navbarToggle");
        const dropdown = document.getElementById("navbarDropdown");
        const navbar = document.getElementById("musicera-navbar");
        const playlistModal = document.getElementById("playlistModal");

        function setNavbarMenuState(isOpen) {
          hamburger.classList.toggle("active", isOpen);
          dropdown.classList.toggle("active", isOpen);
          document.body.classList.toggle("navbar-menu-open", isOpen);
        }

        hamburger.addEventListener("click", () => {
          setNavbarMenuState(!dropdown.classList.contains("active"));
        });

        // Close dropdown on outside click
        document.addEventListener("click", (e) => {
          if (!navbar.contains(e.target)) {
            setNavbarMenuState(false);
          }
        });

        if (playlistModal) {
          playlistModal.addEventListener("click", (event) => {
            if (event.target === playlistModal) {
              closeMyPlaylist();
            }
          });
        }

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            if (typeof closeCreatePlaylistModal === "function") {
              closeCreatePlaylistModal();
            }
            closeMyPlaylist();
          }
        });
      });

      // Get user data from sessionStorage
      const userData = JSON.parse(sessionStorage.getItem("userData") || "{}");

      if (!userData.name) {
        window.location.href = "index.html";
      }

      // Populate navbar user info
      document.getElementById("navbarUserName").textContent =
        userData.name || "User";
      document.getElementById("navbarUserEmail").textContent =
        userData.email || "";
      if (userData.hasFace) {
        document.getElementById("navbarFaceBadge").style.display =
          "inline-flex";
      }

      // Display user info (existing elements)
      const userNameEl = document.getElementById("userName");
      if (userNameEl) userNameEl.textContent = userData.name.split(" ")[0];

      const displayNameEl = document.getElementById("displayName");
      if (displayNameEl) displayNameEl.textContent = userData.name;

      const userEmailEl = document.getElementById("userEmail");
      if (userEmailEl) userEmailEl.textContent = userData.email;

      const faceBadgeEl = document.getElementById("faceBadge");
      if (userData.hasFace && faceBadgeEl) {
        faceBadgeEl.style.display = "inline-flex";
      }

      window.logout = function () {
        sessionStorage.removeItem("userData");
        sessionStorage.removeItem("fromPage");
        window.location.href = "index.html";
      };

      window.goToEmotions = function () {
        sessionStorage.removeItem("fromPage");
        window.location.href = "emotion.html";
      };

      window.openMyPlaylist = function () {
        const playlistModal = document.getElementById("playlistModal");
        if (playlistModal) {
          playlistModal.classList.add("active");
          playlistModal.setAttribute("aria-hidden", "false");
          document.body.classList.add("playlist-modal-open");
        }

        const dropdown = document.getElementById("navbarDropdown");
        const hamburger = document.getElementById("navbarToggle");
        if (dropdown) {
          dropdown.classList.remove("active");
        }
        if (hamburger) {
          hamburger.classList.remove("active");
        }
        document.body.classList.remove("navbar-menu-open");
      };

      window.closeMyPlaylist = function () {
        const playlistModal = document.getElementById("playlistModal");
        if (!playlistModal) {
          return;
        }

        playlistModal.classList.remove("active");
        playlistModal.setAttribute("aria-hidden", "true");
        document.body.classList.remove("playlist-modal-open");
      };

      function handleLogoClick() {
        const fromPage = sessionStorage.getItem("fromPage");
        if (fromPage === "emotion.html") {
          goToEmotions();
        } else {
          window.location.reload();
        }
      }

      // Dynamic logo setup
      document.addEventListener("DOMContentLoaded", function () {
        const logoIcon = document.getElementById("logoIcon");
        const logoText = document.getElementById("logoText");
        const fromPage = sessionStorage.getItem("fromPage");
        const fromMoodFlow = new URLSearchParams(window.location.search).has(
          "mood",
        );

        if (fromPage === "emotion.html" || fromMoodFlow) {
          logoIcon.className = "fas fa-arrow-left";
          logoText.textContent = "Back";
          document.title = "MusicEra - Back to Emotions";
        }
      });
    </script>
    <script src="api-config.js?v=20260321" defer></script>
    <script src="face-auth-menu.js?v=20260321" defer></script>
    <script src="dashboard.js?v=20260321" defer></script>
  </body>
</html>
